<body>

    <!-- ==============================

    <header>

        <div class="nav-container">

                class="logo"

            >
                Dev<span>Space</span>

            <nav aria-label="Main navigation">

                <button
                    class="menu-button"
                    id="menu-button"
                    type="button"
                    aria-expanded="false"

                >
                    ☰
                </button>

                <ul
                    class="nav-list"

                >

                            data-route
                        >

                            data-route
                        >

                        >

                            href="/contact"
                            data-route
                        >

                        </a>
                    </li>

                </ul>

        </div>

    </header>

    <!-- ==============================
         DYNAMIC APPLICATION CONTAINER
         ============================== -->

    <main
        id="app"
        aria-live="polite"
        aria-busy="false"
    >
        <!-- JavaScript dynamically inserts page content here. -->
    </main>

         FOOTER

    </footer>


    <script>
        "use strict";

        /* =========================================
           APPLICATION DATA
           ========================================= */

        const pages = {

            home: {
                title: "Home",
                content: `
                    <section class="page hero">

                        <div class="hero-content">

                            <h1>
                                Build Better
                                <span>Web Experiences.</span>
                            </h1>

                            <p>
                                Welcome to DevSpace, a small-scale Single
                                Page Application demonstrating client-side
                                routing, dynamic content rendering and
                                browser history management.
                            </p>

                            <div class="hero-actions">

                                <a
                                    href="/projects"
                                    data-route
                                    class="button"
                                >
                                    View Projects
                                </a>

                                <a
                                    href="/about"
                                    data-route
                                    class="button secondary"
                                >
                                    Learn More
                                </a>

                            </div>

                        </div>

                        <div class="hero-card">

                            <div class="code">
<pre>
const app = "DevSpace";

function navigate(route) {
    history.pushState({}, "", route);
    renderPage();
}

console.log("SPA loaded!");
</pre>
                            </div>

                        </div>

                    </section>
                `
            },

            about: {
                title: "About",
                content: `
                    <section class="page">

                        <div class="page-heading">

                            <h1>About DevSpace</h1>

                            <p>
                                Understanding the architecture behind
                                this Single Page Application.
                            </p>

                        </div>

                        <div class="about-layout">

                            <div class="info-box">

                                <h2>What is an SPA?</h2>

                                <p>
                                    A Single Page Application loads a single
                                    HTML document and dynamically updates
                                    the displayed content as users navigate.
                                </p>

                                <p>
                                    Instead of requesting a completely new
                                    document for every page, JavaScript
                                    updates the DOM and browser history.
                                </p>

                            </div>

                            <div class="info-box">

                                <h2>Technologies</h2>

                                <p>
                                    <strong>HTML:</strong>
                                    Provides the application structure.
                                </p>

                                <p>
                                    <strong>CSS:</strong>
                                    Provides responsive styling,
                                    transitions and visual design.
                                </p>

                                <p>
                                    <strong>JavaScript:</strong>
                                    Handles routing, DOM updates and
                                    browser history.
                                </p>

                            </div>

                        </div>

                    </section>
                `
            },

            projects: {
                title: "Projects",
                content: `
                    <section class="page">

                        <div class="page-heading">

                            <h1>Projects</h1>

                            <p>
                                Example projects displayed dynamically
                                without a full page refresh.
                            </p>

                        </div>

                        <div class="card-grid">

                            <article class="card project-card">

                                <div class="project-header">
                                    Project 01
                                </div>

                                <div class="project-body">

                                    <h2>Accessible Website</h2>

                                    <p>
                                        A responsive website focused on
                                        semantic HTML and WCAG-friendly
                                        interaction.
                                    </p>

                                    <div class="tags">
                                        <span class="tag">HTML</span>
                                        <span class="tag">CSS</span>
                                        <span class="tag">Accessibility</span>
                                    </div>

                                </div>

                            </article>

                            <article class="card project-card">

                                <div class="project-header">
                                    Project 02
                                </div>

                                <div class="project-body">

                                    <h2>Performance Optimizer</h2>

                                    <p>
                                        A static page optimized for faster
                                        loading and efficient rendering.
                                    </p>

                                    <div class="tags">
                                        <span class="tag">Performance</span>
                                        <span class="tag">JavaScript</span>
                                        <span class="tag">Lighthouse</span>
                                    </div>

                                </div>

                            </article>

                            <article class="card project-card">

                                <div class="project-header">
                                    Project 03
                                </div>

                                <div class="project-body">

                                    <h2>SPA Router</h2>

                                    <p>

                                    <div class="tags">
                                        <span class="tag">SPA</span>
                                        <span class="tag">History API</span>
                                        <span class="tag">DOM</span>
                                    </div>

                                </div>

                            </article>

                        </div>

                    </section>
                `
            },

            contact: {
                title: "Contact",
                content: `
                    <section class="page">

                        <div class="page-heading">

                            <h1>Contact</h1>

                            <p>
                                Send a message without leaving the
                                application.
                            </p>

                        </div>

                        <div class="contact-layout">

                            <div class="contact-info">

                                <h2>Let's Connect</h2>

                                <p>
                                    Have a project idea or want to learn
                                    more about this SPA implementation?
                                </p>

                                <p>
                                    Complete the form and the application
                                    will provide instant feedback without
                                    reloading the page.
                                </p>

                            </div>

                            <form id="contact-form">

                                <div class="form-group">

                                    <label for="name">
                                        Name
                                    </label>

                                    <input
                                        id="name"
                                        name="name"
                                        type="text"
                                        autocomplete="name"
                                        required
                                    >

                                </div>

                                <div class="form-group">

                                    <label for="email">
                                        Email
                                    </label>

                                    <input
                                        id="email"
                                        name="email"
                                        type="email"
                                        autocomplete="email"
                                        required
                                    >

                                </div>

                                <div class="form-group">

                                    <label for="message">
                                        Message
                                    </label>

                                    <textarea
                                        id="message"
                                        name="message"
                                        required
                                    ></textarea>

                                </div>

                                <button
                                    type="submit"
                                    class="button"
                                >
                                    Send Message
                                </button>

                                <p
                                    id="form-message"
                                    class="form-message"
                                    role="status"
                                    aria-live="polite"
                                ></p>

                            </form>

                        </div>

                    </section>
                `
            }

        };


        /* =========================================
           DOM REFERENCES
           ========================================= */

        const app = document.getElementById("app");

        const navigation =
            document.getElementById("main-navigation");

        const menuButton =
            document.getElementById("menu-button");


        /* =========================================
           ROUTE HANDLING
           ========================================= */

        function getRoute() {

            const path =
                window.location.pathname
                    .replace(/\/+$/, "");

            if (path === "" || path === "/") {
                return "home";
            }

            return path.substring(1).toLowerCase();

        }


        /* =========================================
           PAGE RENDERING
           ========================================= */

        function renderPage() {

            const route = getRoute();

            app.setAttribute("aria-busy", "true");

            /*
             * Find the requested page.
             * If the route does not exist, show an error page.
             */

            if (pages[route]) {

                app.innerHTML = pages[route].content;

                document.title =
                    `${pages[route].title} | DevSpace SPA`;

            } else {

                app.innerHTML = `
                    <section class="page error-page">

                        <div>

                            <h1>404</h1>

                            <p>
                                The page you requested could not
                                be found.
                            </p>

                            <a
                                href="/"
                                data-route
                                class="button"
                            >
                                Return Home
                            </a>

                        </div>

                    </section>
                `;

                document.title =
                    "404 | DevSpace SPA";
            }

            updateActiveNavigation(route);

            app.setAttribute("aria-busy", "false");

            /*
             * Attach event handlers to newly generated links.
             */

            attachRouteEvents();

            /*
             * Attach contact form behavior if the contact page
             * is currently displayed.
             */

            attachFormEvents();

            /*
             * Return focus to the main application container
             * after navigation.
             */

            app.setAttribute("tabindex", "-1");
            app.focus({ preventScroll: true });

        }


        /* =========================================
           CLIENT-SIDE NAVIGATION
           ========================================= */

        function navigateTo(url) {

            /*
             * Change the URL without reloading the document.
             */

            history.pushState(
                { route: url },
                "",
                url
            );

            /*
             * Render the new page.
             */

            renderPage();

            /*
             * Close mobile navigation.
             */

            closeMobileMenu();

        }


        /* =========================================
           ROUTE EVENT HANDLERS
           ========================================= */

        function attachRouteEvents() {

            const routeLinks =
                document.querySelectorAll("[data-route]");

            routeLinks.forEach(link => {

                link.addEventListener("click", event => {

                    event.preventDefault();

                    const url =
                        link.getAttribute("href");

                    navigateTo(url);

                });

            });

        }


        /* =========================================
           BROWSER BACK / FORWARD
           ========================================= */

        window.addEventListener("popstate", () => {

            renderPage();

        });


        /* =========================================
           ACTIVE NAVIGATION
           ========================================= */

        function updateActiveNavigation(route) {

            const links =
                navigation.querySelectorAll(".nav-link");

            links.forEach(link => {

                const linkRoute =
                    link.getAttribute("href")
                        .replace("/", "") || "home";

                const isActive =
                    linkRoute === route;

                link.classList.toggle(
                    "active",
                    isActive
                );

                if (isActive) {

                    link.setAttribute(
                        "aria-current",
                        "page"
                    );

                } else {

                    link.removeAttribute(
                        "aria-current"
                    );

                }

            });

        }


        /* =========================================
           MOBILE MENU
           ========================================= */

        menuButton.addEventListener("click", () => {

            const isOpen =
                menuButton.getAttribute(
                    "aria-expanded"
                ) === "true";

            menuButton.setAttribute(
                "aria-expanded",
                String(!isOpen)
            );

            menuButton.setAttribute(
                "aria-label",
                isOpen
                    ? "Open navigation menu"
                    : "Close navigation menu"
            );

            navigation.classList.toggle(
                "open",
                !isOpen
            );

        });


        function closeMobileMenu() {

            navigation.classList.remove("open");

            menuButton.setAttribute(
                "aria-expanded",
                "false"
            );

            menuButton.setAttribute(
                "aria-label",
                "Open navigation menu"
            );

        }


        /* =========================================
           CONTACT FORM
           ========================================= */

        function attachFormEvents() {

            const form =
                document.getElementById("contact-form");

            if (!form) {
                return;
            }

            const message =
                document.getElementById("form-message");

            form.addEventListener(
                "submit",
                event => {

                    event.preventDefault();

                    if (!form.checkValidity()) {

                        message.textContent =
                            "Please complete all required fields.";

                        form.reportValidity();

                        return;
                    }

                    message.textContent =
                        "Thank you! Your message has been submitted successfully.";

                    form.reset();

                }
            );

        }


        /* =========================================
           INITIAL APPLICATION LOAD
           ========================================= */

        document.getElementById("year").textContent =
            new Date().getFullYear();

        /*
         * Render the correct page based on the current URL.
         */

        renderPage();

    </script>

</body>
